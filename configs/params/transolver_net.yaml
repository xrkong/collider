model:
  name: transolver_net

  # ── 空间维度 ──────────────────────────────────────────────────────────
  dim: 3
  input_sequence_length: 5
  nnode_in_features: 15 # 5 frame * 15 features (pos 3 + vel 3 + acc 3 + stress 6) = 75
  nnode_out_features: 3 # 1 frame * acceleration = 3

  # ── 网络结构 ──────────────────────────────────────────────────────────
  hidden_dim: 128
  layers: 8            # number of transolver blocks
  nmlp_layers: 4
  num_heads: 8
  slice_num: 64
  dropout: 0.0
  mlp_ratio: 2
  block_act: silu

train:
  optimizer: adam
  lr: 0.001
  weight_decay: 0.0
  batch_size: 4
  ntraining_steps: 10000
  nsave_steps: 100       

  # ── 损失权重 ──────────────────────────────────────────────────────────
  loss_weight_position:     1.0
  loss_weight_velocity:     0.0    
  loss_weight_acceleration: 1.0   
  loss_weight_stress:       0.0
  loss_weight_vm:           0.0
  collision_weight: 5.0 

  # ── 学习率调度 ────────────────────────────────────────────────────────
  scheduler: step_lr
  scheduler_step_size: 5000
  scheduler_gamma: 0.8

  # ── 其他训练参数 ───────────────────────────────────────────────────────
  grad_clip: 1.0
  keep_top_k: 3       # 保留 val_loss 最低的 K 个 checkpoint

data:
  base_path: "/home/kong/datasets/barrier/split_data/T_lok_F_shape_barrier_9_3_100km_50_2/"
  metadata_path: "/home/kong/datasets/barrier/split_data/T_lok_F_shape_barrier_9_3_100km_50_2/metadata.json"
  dataset_type: bvc 
  num_workers: 0
  pin_memory: true
  collision_threshold: 100.0
  normalize_dist: false

wandb:
  project: barrier-vehicle-collision
  log: true
