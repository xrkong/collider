model:
  name: transolverplus_net

  # ── 空间维度 ──────────────────────────────────────────────────────────
  dim: 3
  input_sequence_length: 5
  nnode_in_features: 40 # 10 * 4 = 40
  nnode_out_features: 3 # 1 * 3 = 3

  # ── 网络结构 ──────────────────────────────────────────────────────────
  hidden_dim: 128
  layers: 8            # number of transolver blocks
  nmlp_layers: 4
  num_heads: 8
  slice_num: 64
  mlp_ratio: 2
  block_act: silu

train:
  optimizer: adam
  lr: 0.001
  weight_decay: 0.0
  batch_size: 8
  ntraining_steps: 1000
  nsave_steps: 100       
  push_forward_k: 1
  

  # ── 其他训练参数 ───────────────────────────────────────────────────────
  grad_clip: 1.0
  keep_top_k: 3       # 保留 val_loss 最低的 K 个 checkpoint

data:
  base_path: "/home/kong/datasets/barrier/split_data/T_lok_F_shape_barrier_9_3_100km/"
  metadata_path: "/home/kong/datasets/barrier/split_data/T_lok_F_shape_barrier_9_3_100km/metadata.json"
  dataset_type: bvc_sliced
  input_frames: 5
  normalize: true
  num_workers: 0
  dt: 0.004
  data.acc_scale: 1.0e7
  # pin_memory: true
  # collision_threshold: 100.0
  # normalize_dist: false

wandb:
  project: barrier-vehicle-collision
  log: true
