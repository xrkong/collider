model:
  name: transolverplus_net

  # ── 空间维度 ──────────────────────────────────────────────────────────
  dim: 3
  input_sequence_length: 5
  nnode_in_features: 40 # 10 * 4 = 40
  nnode_out_features: 3 # 1 * 3 = 3

  # ── 网络结构 ──────────────────────────────────────────────────────────
  hidden_dim: 128
  layers: 8            # number of transolver blocks
  nmlp_layers: 4
  num_heads: 8
  slice_num: 64
  mlp_ratio: 2
  block_act: silu

  # ── Node-type embedding (must match data.node_type) ──────────────────
  num_node_types: 0    # vocab size; 0 = disabled
  type_emb_dim: 0      # embedding dim; 0 = disabled

train:
  optimizer: adam
  lr: 0.001
  weight_decay: 0.0
  batch_size: 8
  n_epochs: 10
  val_every_epochs: 1
  push_forward_k: 1
  

  # ── 其他训练参数 ───────────────────────────────────────────────────────
  grad_clip: 1.0
  keep_top_k: 3       # 保留 val_loss 最低的 K 个 checkpoint

data:
  # dataset_type: bvc_sliced
  input_frames: 5
  normalize: true
  num_workers: 0
  dt: 1 # dt is 1. real dt is 2ms.
  data.acc_scale: 1.0e7

  # ── Node-type embedding switch ────────────────────────────────────────
  node_type: false           # main switch; false = current behaviour
  node_type_field: node_part_label  # h5 metadata/ field name for per-node int label

  # ── Per-region normalization switch (opt-in; false = current global-scalar behaviour) ──
  per_region_norm: false
  region_norm_field: region_id
  region_norm_min_nodes: 1 # ignore regions with fewer nodes than this threshold. AI requested.
  # pin_memory: true
  # collision_threshold: 100.0
  # normalize_dist: false

condition:
  # This is the default every old experiment yaml still inherits unchanged
  # (none of them override `condition:`) — do not change these defaults,
  # add an experiment-yaml-level `condition:` override instead (see
  # wj08_100kph.yaml for an example that drops mass and adds layer/thickness
  # gated by a barrier_label one-hot).
  enabled: [speed, mass]          # D4: only vary-across-trajs scalars; angle/material OFF
  ranges:
    speed:     [60.0, 100.0]      # tested envelope; 60→-1, 80→0, 100→+1
    mass:      [0.0, 1000.0]      # 0→-1, 400→-0.2, 800→+0.6
    angle:     [0.0, 30.0]        # magnitude; abs() applied before norm
    layer:     [0.0, 5.0]         # added-layer count (barrier material stack)
    thickness: [0.0, 30.0]        # mm, added-layer thickness
  material_vocab: [F]
  use_material: false             # single barrier type; flip when a 2nd type joins
  # When use_material=true, material_vocab[0] is the GT/baseline design by
  # convention: normalize_conditions() forces the "layer"/"thickness"
  # channels to a fixed 0.0 for any trajectory whose barrier_label equals
  # material_vocab[0], regardless of the raw layers/thickness values given
  # in that trajectory's data.train_dirs/val_dirs entry.

wandb:
  project: barrier-vehicle-collision
  log: true
