model:
  hidden_dim: 512
  num_layers: 6
  dropout: 0.1
  num_classes: 10

train:
  optimizer: adamw
  lr: 0.001
  weight_decay: 0.01
  batch_size: 32
  epochs: 100
  scheduler: cosine
  warmup_steps: 500
  grad_clip: 1.0

data:
  train_path: data/train.h5
  val_path: data/val.h5
  num_workers: 4
  pin_memory: true
