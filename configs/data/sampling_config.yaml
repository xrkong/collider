# ============================================================
# Sampling Configuration for BVC Surrogate Model
#
# Two-layer node selection strategy:
#   Layer 1 - collision_zone:   all nodes kept unconditionally (no stride)
#   Layer 2 - required_parts:   stride sampled (--node-stride N)
#                               nodes already in Layer 1 are deduplicated out
# ============================================================


# ------------------------------------------------------------
# Layer 1: Collision zone — ALL nodes kept, no stride
# Car front contact face + barrier contact face
# ------------------------------------------------------------
collision_zone:

  car_contact_parts:
    - frontface
    - bumper
    - bumpersteel
    - bumpercover
    - bumperhousing
    - railfront
    - noserail
    - frontrail

  barrier_parts:
    - anchor rebar_t-1
    - anchor rebar_s-1
    - reinforcement-1
    - steel tube-1
    - t lok-1
    - anchor rebar_t-2
    - anchor rebar_s-2
    - reinforcement-2
    - steel tube-2
    - t lok-2


# ------------------------------------------------------------
# Layer 2: Required parts — stride sampled (--node-stride N)
# Collision zone parts listed here too; duplicates are removed
# automatically in code via np.isin deduplication.
# ------------------------------------------------------------
required_parts:

  barrier_parts:
    - concrete_fine_mesh

  front_crash_structure:
