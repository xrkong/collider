# ============================================================
# Sampling Configuration for BVC Surrogate Model
# Node selection strategy:
#   Layer 1 - Whitelist:        all nodes from required parts (existing logic)
#   Layer 2 - Collision zone:   car contact face (all nodes) +
#                               barrier contact face (spatial filter by proximity)
#   Layer 3 - Fill (disabled):  uniform stride sampling from remaining nodes
#                               enable once Layer 1+2 node count is known
# ============================================================


# ------------------------------------------------------------
