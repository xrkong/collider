# ------------------------------------------------------------
# Layer 2: Collision zone — dense sampling
#
# car_contact_parts:  all nodes kept unconditionally
# barrier_parts:      all nodes kept unconditionally for now
#                     (spatial filter via contact_threshold_mm disabled
#                      until node counts are known)
# ------------------------------------------------------------
collision_zone:

  # Car front face: keep ALL nodes
  car_contact_parts:
    - frontface
    - bumper
    - bumpersteel
    - bumpercover
    - bumperhousing
    - railfront
    - noserail
    - frontrail

  # Barrier: keep ALL nodes for now
  barrier_parts:
    - concrete_fine_mesh
    - anchor rebar_t-1
    - anchor rebar_s-1
    - reinforcement-1
    - steel tube-1
    - t lok-1
    - anchor rebar_t-2
    - anchor rebar_s-2
    - reinforcement-2
    - steel tube-2
    - t lok-2

  # Spatial filter — disabled until node counts are assessed.
  # Uncomment and tune if barrier node count is too large.
  # contact_threshold_mm: 300
  # collision_whitelist_cache: data/cache/collision_zone_nodes.npy


# ------------------------------------------------------------
# Layer 3: Fill — disabled for now
# Enable once Layer 1+2 node count is known.
# ------------------------------------------------------------
