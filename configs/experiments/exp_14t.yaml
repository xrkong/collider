name: "exp_14t"
description: "small dataset, 10 frames."
model:
  name: "transolver_net"                        # registry key
  params: "configs/params/transolver_net.yaml"  # base params file

overrides:
  model.hidden_dim: 128
  model.dropout: 0.0
  model.layers: 32            # number of transolver blocks
  model.nmlp_layers: 4
  model.num_heads: 16
  model.slice_num: 64
  model.nnode_in_features: 20
  model.nnode_out_features: 3
  model.input_sequence_length: 10
  model.nnode_in_features: 40 # 10 x (3+1)

  train.lr: 0.001
  train.min_lr: 1e-6
  train.batch_size: 1
  train.ntraining_steps: 2000
  train.scheduler_step_size: 2000

  data.base_path: "/home/kong/datasets/barrier/split_data/T_lok_F_shape_barrier_9_3_100km_10/"
  data.metadata_path: "/home/kong/datasets/barrier/split_data/T_lok_F_shape_barrier_9_3_100km_10/metadata.json"

notes: "velocity -> acceleration, defualt optimizer, loss using Relative L2"
