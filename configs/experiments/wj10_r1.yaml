name: "wj10_r1"
description: "n_epochs=500, lr_cycles=2"
model:
  name: "transolverplus_net"
  params: "configs/params/transolverplus_net.yaml"

overrides:
  wandb.group: "wj10"  

  model.hidden_dim: 256
  model.layers: 32
  model.num_heads: 8
  model.slice_num: 256

  # 35 base (5 frames × (3 vel + 3 position + 1 sdf)) + 8 cond
  # (speed, layer, kirigami_thickness, inter_layer_plate_thickness,
  # w_beam_thickness + 3-way barrier_label one-hot) = 43
  model.nnode_in_features: 43
  model.nnode_out_features: 3
  model.num_node_types: 16
  model.type_emb_dim: 4
  block_act: gelu

  train.lr: 0.001
  train.min_lr: 0.00001
  train.batch_size: 4
  train.accum_steps: 4
  train.n_epochs: 500
  train.lr_cycles: 2
  train.push_forward_k: 2
  train.noise_std: 0.0
  train.grad_clip: 5.0
  train.val_every_epochs: 10
  train.val_batch_size: 1

  data.input_frames: 5
  data.include_position: true
  data.acc_scale: 5.0e5
  data.norm_fields:
    - "positions"
    - "velocity"
    - "acceleration"
  data.node_type: true
  data.per_region_norm: true
  data.node_type_field: region_id

  # condition: mass dropped, speed kept, layer + three thickness dimensions
  # for the new barrier design's material stack. barrier_label is a one-hot
  # categorical (material_vocab[0] = "T_lok" is the GT/baseline convention —
  # see src/conditions.py's GATED_BY_MATERIAL gating: layer/kirigami_thickness/
  # inter_layer_plate_thickness/w_beam_thickness are forced to a neutral 0.0
  # for any trajectory whose barrier_label == material_vocab[0], regardless of
  # the values given below).
  #
  # inter_layer_plate_thickness / w_beam_thickness have no safe zero-default —
  # src/conditions.py raises a loud error at dataset-build time for any
  # train_dirs/val_dirs entry below that's missing one of them while it's
  # enabled here. Several entries below are left blank on purpose (unknown
  # values, see inline TODOs) — fill them in before training, or that entry
  # will fail to load.
  condition:
    enabled: [speed, layer, kirigami_thickness, inter_layer_plate_thickness, w_beam_thickness]
    ranges:
      speed:                       [60.0, 100.0]
      layer:                       [0.0, 4.0]      # observed values: 0, 2, 3, 4
      kirigami_thickness:          [0.3, 0.7]       # mm
      inter_layer_plate_thickness: [1.0, 2.0]       # mm
      w_beam_thickness:            [2.7, 3.5]       # mm
    material_vocab: [T_lok, New_No_Beam, New_Beam]   # index 0 = GT, gates the stack fields off
    use_material: true
  # --resume-artifact "checkpoint-wj01:best"

  # Trajectory lists live under configs/train_dirs/ (not inlined) so they can
  # be updated/shared across wj10_* experiments in one place — see train.py's
  # _resolve_dirs_override.
  data.train_dirs: "configs/dataset_dirs/wj10_r1_train.yaml"
  data.val_dirs: "configs/dataset_dirs/wj10_r1_val.yaml"

notes: "k=2, 4x4, 126GB;"
