name: "sc_035"
description: "noise std 0.05, deeper model."
model:
  name: "transolverplus_net"                        # registry key
  params: "configs/params/transolverplus_net.yaml"  # base params file

overrides:
  model.hidden_dim: 256
  model.layers: 8            # number of transolver blocks
  model.nmlp_layers: 2
  model.num_heads: 8
  model.slice_num: 256
  

  model.nnode_in_features: 20 # 10 x (3+1)
  model.nnode_out_features: 3

  train.lr: 0.0005
  train.min_lr: 0.00001
  train.batch_size: 4
  train.accum_steps: 2 
  train.n_epochs: 500
  train.push_forward_k: 1
  train.noise_std: 0.05
  train.grad_clip: 5.0
  train.val_every_epochs: 10

  data.train_paths: "/home/kong/datasets/barrier/h5/T_lok_F_shape_barrier_9_3_100km_50_5_dt/output.h5"
  data.val_paths: "/home/kong/datasets/barrier/h5/T_lok_F_shape_barrier_9_3_80km_50_5_dt/output.h5"
  data.input_frames: 5
  data.acc_scale: 5.0e5
  data.metadata_path: "/home/kong/datasets/barrier/h5/T_lok_F_shape_barrier_9_3_100km_50_5_dt/metadata.json"

notes: "Hopefully this is the final sanity check."
