# 每次新实验复制此文件，只写 overrides。
# 不要在这里复制完整参数 — 完整默认值在 configs/params/ 中维护。

name: "exp_001"
description: "Baseline run with default params; testing lower LR and higher dropout."

model:
  name: "model_template"                        # registry key
  params: "configs/params/model_template.yaml"  # base params file

overrides:
  train.lr: 0.0005
  model.dropout: 0.2

notes: "First experiment. Comparing against SGD baseline in exp_002."
