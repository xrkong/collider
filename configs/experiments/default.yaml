name: "default"
description: "Pure transolver with input of velocity, output of acceleration"

model:
  name: "transolver"                        # registry key
  params: "configs/params/transolver.yaml"  # base params file

overrides:
  train.lr: 0.0001
  model.dropout: 0.2
  train.batch_size: 2
  model.hidden_dim: 256
  train.ntraining_steps: 5000

notes: "velocity -> acceleration"
