name: "sc_026"
description: "copy of sc_025. remove self._acc_scale * np.sinh(arrd). use original timestep for raw acceleration."
model:
  name: "transolverplus_net"                        # registry key
  params: "configs/params/transolverplus_net.yaml"  # base params file

overrides:
  model.hidden_dim: 256
  model.layers: 8            # number of transolver blocks
  model.nmlp_layers: 8
  model.num_heads: 8
  model.slice_num: 128
  

  model.nnode_in_features: 20 # 10 x (3+1)
  model.nnode_out_features: 3

  train.lr: 0.001
  train.min_lr: 1e-6
  train.batch_size: 8
  train.n_epochs: 2000
  train.push_forward_k: 1
  train.noise_std: 0.01
  train.grad_clip: 5.0
  train.val_every_epochs: 10

  data.paths: "/home/kong/datasets/barrier/h5/T_lok_F_shape_barrier_9_3_100km_50_1_01/output.h5"
  data.input_frames: 5 
  data.acc_scale: 5.0e5
  data.metadata_path: "/home/kong/datasets/barrier/h5/T_lok_F_shape_barrier_9_3_100km_50_1_01/metadata.json"

notes: "copy of sc_022, but trained on 50_1.h5, use raw timestep."
