name: "sc_010"
description: "change loss to acceleration-only MSE loss, k = 1, 5000 training steps"
model:
  name: "transolver_net"                        # registry key
  params: "configs/params/transolver_net.yaml"  # base params file

overrides:
  model.hidden_dim: 256
  model.layers: 8            # number of transolver blocks
  model.nmlp_layers: 8
  model.num_heads: 8
  model.slice_num: 128
  

  model.nnode_in_features: 20 # 10 x (3+1)
  model.nnode_out_features: 3

  train.lr: 0.001
  train.min_lr: 1e-6
  train.batch_size: 2
  train.ntraining_steps: 5000
  train.scheduler_step_size: 5000
  train.push_forward_k: 1
  train.noise_std: 0.0
  train.grad_clip: 5.0

  data.paths: "/home/kong/datasets/barrier/h5/T_lok_F_shape_barrier_9_3_100km_50_5/output.h5"
  data.input_frames: 5 
  data.acc_scale: 1.0e7 #1e7
  data.metadata_path: "/home/kong/datasets/barrier/h5/T_lok_F_shape_barrier_9_3_100km_50_5/metadata.json"

notes: "k=1 bs=2. ablation study."
