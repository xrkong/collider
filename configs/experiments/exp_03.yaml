name: "exp_03"
description: "transolver net lower learning rate"

model:
  name: "transolver_net"                        # registry key
  params: "configs/params/transolver_net.yaml"  # base params file

overrides:
  # 训练
  train.lr: 0.0001
  train.batch_size: 1
  train.ntraining_steps: 3000
  train.nsave_steps: 100
  train.loss_weight_mse: 1.0
  train.loss_weight_vm: 0.0      # ← 先关掉 VM loss，只优化 MSE
  train.weight_decay: 0.0
  train.grad_clip: 0.5

  # 小模型
  model.hidden_dim: 128
  model.layers: 4
  model.nmlp_layers: 2
  model.dropout: 0.0

  # 只用 5 个 window
  data.overfit_n_windows: 5

notes: "First experiment. Comparing against SGD baseline in exp_002."
