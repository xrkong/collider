name: "exp_11"
description: "new pipeline, add sdf, rollout implemented."

model:
  name: "transolver_net"                        # registry key
  params: "configs/params/transolver_net.yaml"  # base params file

overrides:
  model.hidden_dim: 128
  model.dropout: 0.0
  model.layers: 32            # number of transolver blocks
  model.nmlp_layers: 4
  model.num_heads: 16
  model.slice_num: 64
  model.nnode_in_features: 20
  model.nnode_out_features: 3

  train.lr: 0.001
  train.min_lr: 1e-6
  train.batch_size: 1
  train.ntraining_steps: 10000
  train.scheduler_step_size: 10000

notes: "velocity -> acceleration, defualt optimizer, loss using Relative L2"
