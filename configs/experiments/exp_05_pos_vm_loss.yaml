name: "exp_05"
description: "New loss function for loss position and loss of vm stress."

model:
  name: "transolver_net"                        # registry key
  params: "configs/params/transolver_net.yaml"  # base params file

overrides:
  train.lr: 0.0001
  train.ntraining_steps: 5000
  train.batch_size: 2

  model.dropout: 0.2
  model.hidden_dim: 256
  model.loss_weight_position:     1.0
  model.loss_weight_velocity:     0.1    
  model.loss_weight_acceleration: 0.01

notes: "Position and VM stress loss experiment."
