name: "sc_039"
description: "push forward k=2 takes too much time, so reduce to 1. epoch decrease to 100 for quick test. Otherwise same as sc_038."
model:
  name: "transolverplus_net"
  params: "configs/params/transolverplus_net.yaml"

overrides:
  model.hidden_dim: 256
  model.layers: 8
  model.nmlp_layers: 2
  model.num_heads: 8
  model.slice_num: 256

  model.nnode_in_features: 20  # 5 frames x (3 vel + 1 sdf)
  model.nnode_out_features: 3

  train.lr: 0.0005
  train.min_lr: 0.00001
  train.batch_size: 1
  train.accum_steps: 2
  train.n_epochs: 100
  train.push_forward_k: 1
  train.noise_std: 0.05
  train.grad_clip: 5.0
  train.val_every_epochs: 10
  train.val_batch_size: 1

  data.input_frames: 5
  data.acc_scale: 5.0e5
  data.norm_fields:
    - "positions"
    - "velocity"
    - "acceleration"

  data.train_dirs:
    - "/home/kong/datasets/barrier/h5/T_lok_F_shape_barrier_9_3_100km_50ns_5fs"
    - "/home/kong/datasets/barrier/h5/T_lok_F_shape_barrier_9_3_60km_50ns_5fs"
  data.val_dirs:
    - "/home/kong/datasets/barrier/h5/T_lok_F_shape_barrier_9_3_80km_50ns_5fs"

notes: "First multi-traj run. Global stats computed from 100km+60km, val=80km."
